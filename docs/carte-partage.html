<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Carte de partage Call-in BordeauxJS</title>
  <link rel="stylesheet" href="../public/brand/affiche.css">
  <style>
    body { width: 1200px; height: 630px; display: grid; grid-template-rows: 140px 350px 140px; background: #111; color: #f6f5f0; }
    header, main, footer { display: grid; place-items: center; }
    .bjs-wordmark { font-size: 35px; }
    main { background: var(--yellow); color: #111; font-size: 122px; font-weight: 900; font-stretch: 125%; letter-spacing: -.065em; line-height: 1; }
    footer { font-size: 37px; font-weight: 700; letter-spacing: -.035em; }
  </style>
</head>
<body>
  <header><span class="bjs-wordmark">Bordeaux<span class="bjs-tile">JS</span></span></header>
  <main>CALL-IN</main>
  <footer>La parole est au public.</footer>
</body>
</html>
