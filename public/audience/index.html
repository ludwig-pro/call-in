<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <script src="/brand/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/brand/call-in-mark.svg" />
    <link rel="stylesheet" href="/brand/affiche.css" />
    <link rel="stylesheet" href="/audience/audience.css" />
    <meta name="description" content="Posez votre question et votez pour celles que vous aimeriez voir abordées pendant le meetup." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Call-in BordeauxJS" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Les questions du public · Call-in BordeauxJS" />
    <meta property="og:description" content="Posez votre question et votez pour celles que vous aimeriez voir abordées pendant le meetup." />
    <meta property="og:image" content="https://call-in.bordeauxjs.com/brand/call-in-bordeauxjs-partage.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Call-in BordeauxJS — La parole est au public, en noir et jaune." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Les questions du public · Call-in BordeauxJS" />
    <meta name="twitter:description" content="Posez votre question et votez pour celles que vous aimeriez voir abordées pendant le meetup." />
    <meta name="twitter:image" content="https://call-in.bordeauxjs.com/brand/call-in-bordeauxjs-partage.png" />
    <meta name="twitter:image:alt" content="Call-in BordeauxJS — La parole est au public, en noir et jaune." />
    <title>Les questions du public · Call-in BordeauxJS</title>
  </head>
  <body>
    <header class="audience-masthead">
      <div class="masthead-inner">
        <a href="/fr/" class="audience-home" aria-label="Accueil BordeauxJS">
          <span class="bjs-wordmark"><span class="audience-brand-name">Bordeaux</span><span class="bjs-tile">JS</span></span>
        </a>
        <h1 class="event-heading"><span data-event-title>Questions du public</span></h1>
        <button class="theme-toggle" type="button" data-theme-toggle data-light-label="Activer le thème clair" data-dark-label="Activer le thème sombre" aria-label="Activer le thème sombre">☾</button>
      </div>
    </header>
    <main class="page">
      <nav class="view-nav" aria-label="Participation">
        <a href="#questions" data-show-list>Les questions</a>
        <a href="#poser" data-show-form aria-current="true">Poser une question</a>
      </nav>
      <p class="message" data-message role="status" aria-live="polite"></p>
      <div class="participation">
        <section data-list-view aria-labelledby="list-title" hidden>
          <h2 id="list-title" tabindex="-1">Questions du public</h2>
          <p class="connection" data-connection role="status"></p>
          <p class="list-error" data-list-error role="status" hidden></p>
          <button class="retry" type="button" data-retry hidden>Réessayer</button>
          <div class="questions" data-questions></div>
        </section>
        <section data-form-view aria-labelledby="form-title">
          <h2 id="form-title" tabindex="-1">Poser une question</h2>
          <form id="question-form" method="post">
            <label for="nickname">Votre pseudo</label>
            <input id="nickname" name="nickname" autocomplete="nickname" minlength="1" maxlength="24" required placeholder="Comment vous appeler ?" />
            <label for="question">Votre question</label>
            <textarea id="question" name="question" minlength="4" maxlength="280" rows="5" required placeholder="Écrivez votre question…"></textarea>
            <button type="submit" disabled>Envoyer <span aria-hidden="true">↗</span></button>
          </form>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
