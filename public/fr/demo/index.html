<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <link rel="icon" href="/brand/call-in-mark.svg" type="image/svg+xml" />
    <script src="/brand/theme.js"></script>
    <link rel="stylesheet" href="/brand/affiche.css" />
    <link rel="stylesheet" href="/demo/demo.css" />
    <title>Démonstration · Call-in BordeauxJS</title>
  </head>
  <body data-locale="fr">
    <header class="demo-toolbar">
      <a class="demo-brand" href="/fr/" aria-label="Accueil Call-in BordeauxJS">
        <span class="bjs-wordmark">Bordeaux<span class="bjs-tile">JS</span></span>
        <b>Call-in / Démo</b>
      </a>
      <span class="demo-state">Démo publique · remise à zéro chaque jour</span>
      <nav aria-label="Outils de démonstration">
        <button type="button" data-fullscreen>Plein écran</button>
        <a class="toolbar-primary" href="/fr/#create">Créer mon événement ↗</a>
      </nav>
    </header>
    <main class="demo-layout">
      <section class="deck-pane" aria-label="Présentation d’exemple">
        <iframe src="/fr/demo/slides/" title="Présentation d’exemple Call-in" allowfullscreen></iframe>
      </section>
      <aside class="response-pane" aria-label="Questions de la démonstration">
        <iframe src="/fr/demo/dashboard/" title="Tableau de bord de démonstration" allow="fullscreen"></iframe>
      </aside>
    </main>
    <script type="module" src="/demo/demo.js"></script>
  </body>
</html>
